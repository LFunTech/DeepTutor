[program:backend]
command=/bin/bash /app/start-backend.sh
directory=/app
user=deeptutor
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONPATH="/app:/app/extensions/enterprise/src",PYTHONUNBUFFERED="1"

[program:frontend-core]
command=/bin/bash /app/start-core-frontend.sh
directory=/app/web
user=deeptutor
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"

[program:frontend-oms]
command=/bin/bash /app/start-enterprise-frontend.sh
directory=/app/enterprise-frontends/oms/apps/oms
user=deeptutor
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",ENTERPRISE_FRONTEND_APP="oms",ENTERPRISE_FRONTEND_PORT="3783"

[program:frontend-tms]
command=/bin/bash /app/start-enterprise-frontend.sh
directory=/app/enterprise-frontends/tms/apps/tms
user=deeptutor
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",ENTERPRISE_FRONTEND_APP="tms",ENTERPRISE_FRONTEND_PORT="3784"

[program:frontend-gateway]
command=/bin/bash /app/start-frontend.sh
directory=/app
user=deeptutor
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"
