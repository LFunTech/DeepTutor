apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deeptutor-protected-k8s-release-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: deeptutor-protected-k8s-release
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6379
