apiVersion: apps/v1
kind: Deployment
metadata:
  name: deeptutor-docs
  labels:
    app.kubernetes.io/name: deeptutor-docs
    app.kubernetes.io/part-of: deeptutor-agent-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deeptutor-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deeptutor-docs
        app.kubernetes.io/part-of: deeptutor-agent-docs
    spec:
      serviceAccountName: deeptutor-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: "${DEEPTUTOR_DOCS_IMAGE_DIGEST}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: docs-http
          readinessProbe:
            httpGet:
              path: /healthz
              port: docs-http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: docs-http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deeptutor-docs
spec:
  selector:
    app.kubernetes.io/name: deeptutor-docs
  ports:
    - name: http
      port: 80
      targetPort: docs-http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deeptutor-docs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: deeptutor-docs
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress: []
