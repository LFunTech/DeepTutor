apiVersion: apps/v1
kind: Deployment
metadata:
  name: deeptutor-backend
  labels:
    app.kubernetes.io/name: deeptutor-backend
    app.kubernetes.io/part-of: deeptutor-protected-k8s-release
spec:
  replicas: ${DEEPTUTOR_BACKEND_EXECUTOR_REPLICAS}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deeptutor-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deeptutor-backend
        app.kubernetes.io/part-of: deeptutor-protected-k8s-release
      annotations:
        deeptutor.f123.pub/deployment-config-hash: "${DEEPTUTOR_DEPLOYMENT_CONFIG_HASH}"
    spec:
      serviceAccountName: deeptutor-runtime
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: "${DEEPTUTOR_RUNTIME_IMAGE_DIGEST}"
          imagePullPolicy: IfNotPresent
          env:
            - name: DEEPTUTOR_PROTECTED_RUNTIME
              value: "1"
            - name: DEEPTUTOR_RUNTIME_MODE
              value: kubernetes
            - name: DEEPTUTOR_EXECUTION_MODE
              value: "${DEEPTUTOR_EXECUTION_MODE}"
            - name: DEEPTUTOR_RELEASE_LOCK_REQUIRED
              value: "true"
            - name: DEEPTUTOR_RELEASE_ID
              value: "${DEEPTUTOR_RELEASE_ID}"
            - name: DEEPTUTOR_TARGET_ENV_ID
              value: "${DEEPTUTOR_TARGET_ENV_ID}"
            - name: DEEPTUTOR_TURN_COORDINATION_BACKEND
              value: "${DEEPTUTOR_TURN_COORDINATION_BACKEND}"
            - name: DEEPTUTOR_REDIS_KEY_PREFIX
              value: "${DEEPTUTOR_REDIS_KEY_PREFIX}"
            - name: DEEPTUTOR_POSTGRES_CONFIG
              value: /etc/deeptutor/deployment.json
            - name: DT_EDUPLUS2_FRONTING_DEMO_REDIRECT_URI
              value: "https://${DEEPTUTOR_INGRESS_HOST}/api/v1/auth/eduplus2/demo/callback"
            - name: DT_EDUPLUS2_FRONTING_DEMO_RETURN_URL
              value: "https://${DEEPTUTOR_INGRESS_HOST}/enterprise/eduplus2/conversation-test"
            - name: DT_EDUPLUS2_OMS_REDIRECT_URI
              value: "https://${DEEPTUTOR_INGRESS_HOST}/oms/auth/callback"
            - name: DT_EDUPLUS2_OMS_RETURN_URL
              value: "https://${DEEPTUTOR_INGRESS_HOST}/oms"
            - name: DT_EDUPLUS2_OMS_ENABLED
              value: "${DEEPTUTOR_EDUPLUS2_OMS_ENABLED}"
            - name: DT_EDUPLUS2_OMS_DISCOVERY_URL
              value: "${DEEPTUTOR_EDUPLUS2_OMS_DISCOVERY_URL}"
            - name: DT_EDUPLUS2_OMS_OIDC_ISSUER
              value: "${DEEPTUTOR_EDUPLUS2_OMS_OIDC_ISSUER}"
            - name: DT_EDUPLUS2_OMS_AUDIENCE
              value: "${DEEPTUTOR_EDUPLUS2_OMS_AUDIENCE}"
            - name: DT_EDUPLUS2_OMS_CLIENT_ID
              value: "${DEEPTUTOR_EDUPLUS2_OMS_CLIENT_ID}"
            - name: DT_EDUPLUS2_OMS_ACCOUNT_STATUS_URL
              value: "${DEEPTUTOR_EDUPLUS2_OMS_ACCOUNT_STATUS_URL}"
            # EduPlus2 profile/permission checks are optional enhanced gates. The
            # current test-cn EduPlus2 endpoints expose the Me Profile API as a
            # user-token GET contract, while this release baseline's optional
            # clients call the not-yet-aligned M2M open APIs. Keep them
            # explicitly disabled so the supported JWT + resolve + allowlist
            # exchange path remains usable and is not overridden by secret envs.
            - name: DT_EDUPLUS2_PROFILE_URL
              value: "off"
            - name: DT_EDUPLUS2_PERMISSION_URL
              value: "off"
          envFrom:
            - secretRef:
                name: deeptutor-runtime-secrets
          volumeMounts:
            - name: deployment-config
              mountPath: /etc/deeptutor
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: backend-http
            periodSeconds: 10
            failureThreshold: 3
          ports:
            - containerPort: 8001
              name: backend-http
            - containerPort: 3782
              name: frontend-http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: deployment-config
          configMap:
            name: deeptutor-deployment-config
---
apiVersion: v1
kind: Service
metadata:
  name: deeptutor-backend
spec:
  selector:
    app.kubernetes.io/name: deeptutor-backend
  ports:
    - name: http
      port: 80
      targetPort: frontend-http
    - name: backend-http
      port: 8001
      targetPort: backend-http
