apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deeptutor-backend
spec:
  tls:
    - hosts: ["${DEEPTUTOR_INGRESS_HOST}"]
      secretName: "${DEEPTUTOR_TLS_SECRET_NAME}"
  rules:
    - host: "${DEEPTUTOR_INGRESS_HOST}"
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: deeptutor-docs
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deeptutor-backend
                port:
                  name: http
