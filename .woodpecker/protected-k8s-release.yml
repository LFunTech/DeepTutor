  - name: build-runtime-image-prod-overseas-a
    image: docker-hub.f123.pub/devops/kaniko:v1.14.0-debug
    depends_on: [prepare-release-metadata]
    when:
      - event: tag
        ref: refs/tags/deploy/prod-overseas-a/**
    environment:
      HOME: /kaniko
      REGISTRY_PUSH_USERNAME:
        from_secret: DT_PROD_OVERSEAS_A_REGISTRY_PUSH_USERNAME
      REGISTRY_PUSH_TOKEN:
        from_secret: DT_PROD_OVERSEAS_A_REGISTRY_PUSH_TOKEN
    commands:
      - . ./.deeptutor-release.env
      - test "$${DEEPTUTOR_TARGET_ENV_ID}" = "prod-overseas-a"
      - |
        registry_host="$$(printf '%s' "$${DEEPTUTOR_REGISTRY_REPOSITORY}" | cut -d/ -f1)"
        test -n "$${REGISTRY_PUSH_USERNAME:-}"
        test -n "$${REGISTRY_PUSH_TOKEN:-}"
        mkdir -p /kaniko/.docker
        auth="$$(python -c 'import base64, os; print(base64.b64encode((os.environ["REGISTRY_PUSH_USERNAME"] + ":" + os.environ["REGISTRY_PUSH_TOKEN"]).encode()).decode())')"
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$${registry_host}" "$${auth}" > /kaniko/.docker/config.json
        /kaniko/executor --context "$${CI_WORKSPACE:-.}" --dockerfile "$${CI_WORKSPACE:-.}/Dockerfile" --destination "$${DEEPTUTOR_REGISTRY_REPOSITORY}/runtime:$${DEEPTUTOR_IMAGE_TAG}" --cache=true --cache-repo "$${registry_host}/lfun/cache-deeptutor" --single-snapshot --snapshot-mode=redo


  - name: pre-deploy-check-prod-overseas-a
    image: docker-hub.f123.pub/base/ci-tools:alpine-3.22.4
    depends_on: [build-runtime-image-prod-overseas-a]
    when:
      - event: tag
        ref: refs/tags/deploy/prod-overseas-a/**
    environment:
      REGISTRY_PUSH_USERNAME:
        from_secret: DT_PROD_OVERSEAS_A_REGISTRY_PUSH_USERNAME
      REGISTRY_PUSH_TOKEN:
        from_secret: DT_PROD_OVERSEAS_A_REGISTRY_PUSH_TOKEN
    commands:
      - . ./.deeptutor-release.env
      - test "$${DEEPTUTOR_TARGET_ENV_ID}" = "prod-overseas-a"
      - |
        set -euo pipefail
        registry_host="$$(printf '%s' "$${DEEPTUTOR_REGISTRY_REPOSITORY}" | cut -d/ -f1)"
        registry_path="$$(printf '%s' "$${DEEPTUTOR_REGISTRY_REPOSITORY}" | cut -d/ -f2-)"
        manifest_url="https://$${registry_host}/v2/$${registry_path}/runtime/manifests/$${DEEPTUTOR_IMAGE_TAG}"
        headers="$$(mktemp)"
        curl --fail --silent --show-error --head --user "$${REGISTRY_PUSH_USERNAME}:$${REGISTRY_PUSH_TOKEN}" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' "$${manifest_url}" > "$${headers}"
        digest="$$(awk 'BEGIN{IGNORECASE=1} /^Docker-Content-Digest:/ {print $2}' "$${headers}" | tr -d '\r' | tail -n1)"
        test -n "$${digest}"
        case "$${digest}" in sha256:*) ;; *) echo "unexpected digest: $${digest}" >&2; exit 2 ;; esac
        printf "export DEEPTUTOR_RUNTIME_IMAGE_DIGEST='%s/runtime@%s'\n" "$${DEEPTUTOR_REGISTRY_REPOSITORY}" "$${digest}" > "$IMAGE_ENV_FILE"
        test -s "$IMAGE_ENV_FILE"


